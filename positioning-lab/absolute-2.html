<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positioning Lab</title>
  <style type="text/css">
    /* ---------------Box Sizing----------------- */
    html {
      box-sizing: border-box;
    }
    *,
    *:before,
    *:after {
      box-sizing: inherit;
    }
    body {
      background-color: #ECECEC;
      font-weight: bold;
      font-family: Tahoma, Geneva, sans-serif;
      color: #FFF;
      text-align: center;
      line-height: 24px;
    }
    #wrapper {
      background-color: #FFF;
      border: 1px solid #c0c0c0;
      width: 700px;
      height: 611px;
      margin-right: auto;
      margin-left: auto;
      border-style: outset;
      margin-top: 75px;      
      margin-bottom: 50px;
      text-shadow: 2px 2px #000;
    }
    #navy {
      background-color: #001f3f;
      height:100px;
      width:100px;
      position:absolute;
      top: 120px;
      left: 418px;
    }
    #teal {
      background-color: #39CCCC;
      height:100px;
      width:100px;
      position:absolute;
      top: 120px;
      right: 417px;
    }
    #blue {
      background-color: #0074D9;
      height:100px;
      width:100px;
      position:absolute;
      bottom: 0px;
      left: 418px;
    }
    #aqua {
      background-color: #7FDBFF;
      height:100px;
      width:100px;
      position:absolute;
      bottom: 0px;
      right: 417px;
    }
    #footer {
      background-color: #666;
      height:100px;
      width:100px;
      position:absolute;
      top:360px;
      left:580px;
     
    }
    h1 {
      color: #000;
      font-weight: normal;
      padding: 0px;
    }
  </style>
</head>
<body>
  <h1>Exercise</h1>
  <section id="wrapper">
    <div id="navy">Navy</div>
    <div id="teal">Teal</div>
    <div id="blue">Blue</div>
    <div id="aqua">Aqua</div>
    <div id="footer">Footer</div>
  </section>
</body>

</html>
